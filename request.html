<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Google Doc Request · CHSchat</title>
    <style>
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #000000;
            --muted: #6B6B70;
            --line: rgba(0, 0, 0, .10);
            --field: #FFFFFF;
            --accent: #007AFF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1C1C1E;
                --text: #FFFFFF;
                --muted: #A1A1A6;
                --line: rgba(255, 255, 255, .15);
                --field: rgba(255, 255, 255, .08);
                --accent: #0A84FF;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 26px 22px;
        }

        .brand {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--muted);
        }

        h1 {
            margin: 10px 0 0;
            font-size: 19px;
            font-weight: 600;
            line-height: 1.35;
        }

        p {
            margin: 8px 0 0;
            font-size: 13px;
            line-height: 1.55;
            color: var(--text);
        }

        .bot {
            margin-top: 14px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--muted);
        }

        .bot code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: var(--text);
            user-select: all;
            word-break: break-all;
        }

        input[type="text"] {
            width: 100%;
            margin-top: 18px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
        }

        input[type="text"]::placeholder { color: var(--muted); }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            color: #FFFFFF;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity .15s ease, transform .1s ease;
        }

        button:disabled { opacity: .5; cursor: default; }
        button:active { transform: scale(.98); }

        .status {
            margin-top: 12px;
            font-size: 12.5px;
            line-height: 1.55;
        }

        .status.error { color: #FF3B30; }
        .status.done { color: var(--text); }
        .hidden { display: none; }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">CHSCHAT</div>
        <h1 id="headline">Loading request…</h1>
        <div id="form">
            <p id="hint">Paste your Google Doc link. Set access to <strong>"Anyone with the link can comment"</strong> so it can be reviewed.</p>
            <input type="text" id="docUrl" placeholder="https://docs.google.com/document/d/..." autocomplete="off"
                autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other">
            <button id="submitBtn" type="button">Submit</button>
            <div class="bot">Or share the doc with <code id="botEmail">…</code> as a Commenter.</div>
        </div>
        <div id="status" class="status hidden"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";
        import { firebaseConfig } from "./js/config.js";

        const functions = getFunctions(initializeApp(firebaseConfig));
        const call = (name) => httpsCallable(functions, name);

        const requestId = new URLSearchParams(location.search).get('id') || '';
        const headline = document.getElementById('headline');
        const form = document.getElementById('form');
        const statusEl = document.getElementById('status');
        const input = document.getElementById('docUrl');
        const btn = document.getElementById('submitBtn');

        let requesterName = 'A CHSchat user';

        function showStatus(text, kind) {
            statusEl.className = `status ${kind}`;
            statusEl.innerText = text;
        }

        async function load() {
            if (!requestId) {
                headline.innerText = 'This request link is not valid.';
                form.classList.add('hidden');
                return;
            }
            try {
                const res = await call('readDocRequest')({ requestId });
                requesterName = res.data.requesterName || requesterName;
                document.getElementById('botEmail').innerText = res.data.botEmail || '';
                headline.innerText = `${requesterName} has requested a Google Doc from you.`;
            } catch (e) {
                console.warn('[DocRequest] read failed:', e);
                headline.innerText = e && e.code === 'not-found'
                    ? e.message
                    : 'We could not reach the request service. Please try again in a moment.';
                form.classList.add('hidden');
            }
        }

        async function submit() {
            const url = input.value.trim();
            if (!url) return;
            btn.disabled = true;
            btn.innerText = 'Checking…';
            showStatus('', '');
            try {
                const res = await call('submitDocRequest')({ requestId, url });
                const out = res.data || {};
                if (out.ok) {
                    form.classList.add('hidden');
                    headline.innerText = 'Thanks! Your document is in.';
                    showStatus(`${requesterName} can now see "${out.title}" in their writing portfolio.`, 'done');
                } else {
                    showStatus(out.message || 'We could not accept that document. Please check the link and try again.', 'error');
                }
            } catch (e) {
                console.warn('[DocRequest] submit failed:', e);
                showStatus('Something went wrong on our side. Please try again in a moment.', 'error');
            }
            btn.disabled = false;
            btn.innerText = 'Submit';
        }

        btn.addEventListener('click', submit);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submit();
            }
        });

        load();
    </script>
</body>

</html>
