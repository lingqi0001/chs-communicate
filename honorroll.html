<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Honor Roll - CHS Tools</title>
    <script>
        // Theme Initializer
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="apple-touch-icon" href="resources/apple-touch-icon.svg">
    <meta name="theme-color" content="#007AFF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            future: {
                hoverOnlyWhenSupported: true
            }
        }
    </script>
    <link rel="stylesheet" href="style.css?v=20260612-1741">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-white dark:bg-black flex flex-col h-full w-full">
    <!-- Extension Header (Identical to CHSchat Extension View) -->
    <header class="flex-shrink-0 flex items-center justify-between px-4 pt-safe h-16 bg-white/90 dark:bg-[#1C1C1E]/90 backdrop-blur-xl border-b border-gray-200 dark:border-white/10 z-10 relative">
        <div class="w-auto z-10">
            <button onclick="goBack()" class="text-[#007AFF] text-base flex items-center active:opacity-50 transition-opacity">
                <svg class="w-6 h-6 -ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                </svg>
                Back
            </button>
        </div>

        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 font-bold text-base text-black dark:text-white truncate max-w-[50%] text-center pointer-events-none">
            Honor Roll
        </div>

        <div class="w-auto flex justify-end items-center gap-1 z-10">
            <button onclick="openExternal()" title="Open in New Window" class="p-2 text-gray-400 hover:text-[#007AFF] active:scale-90 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <button onclick="reloadTool()" title="Refresh" class="p-2 text-gray-400 hover:text-[#007AFF] active:scale-90 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Extension Frame Container -->
    <main class="flex-1 relative bg-white dark:bg-black overflow-hidden">
        <iframe id="toolFrame" class="w-full h-full border-none" src="extensions/staff/Honor Roll.html" onload="onFrameLoaded()"></iframe>
        <div id="toolLoading" class="absolute inset-0 flex items-center justify-center bg-white dark:bg-[#1C1C1E] z-10 transition-opacity duration-200">
            <div class="flex flex-col items-center gap-3">
                <div class="w-8 h-8 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                <div class="text-xs text-gray-400 font-bold uppercase tracking-widest">Launching Tool...</div>
            </div>
        </div>
    </main>

    <script>
        function goBack() {
            window.location.href = '/?tab=tools';
        }

        function openExternal() {
            window.open('extensions/staff/Honor Roll.html', '_blank');
        }

        function reloadTool() {
            const frame = document.getElementById('toolFrame');
            const loader = document.getElementById('toolLoading');
            if (loader) loader.style.display = 'flex';
            if (frame) frame.src = frame.src;
        }

        function onFrameLoaded() {
            const loader = document.getElementById('toolLoading');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 200);
            }
        }
    </script>
</body>
</html>
